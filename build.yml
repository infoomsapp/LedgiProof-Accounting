name: Build & Release LedgiProof

on:
  push:
    tags:
      - "v*"           # triggers on v0.1.0, v1.0.0, etc.
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        shell: bash
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION:       ${{ github.ref_name }}
          VITE_ENGINE_VERSION:    "1.0.0"
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"           >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_APP_VERSION=$VITE_APP_VERSION"             >> .env
          echo "VITE_ENGINE_VERSION=$VITE_ENGINE_VERSION"       >> .env

      - name: Build renderer + main
        run: npm run build

      - name: Package — Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package — macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # set to true + add CSC_LINK for signing

      - name: Package — Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ledgiproof-${{ matrix.platform }}
          path: release/
          retention-days: 7